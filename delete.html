<!-- To delete student data-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Student</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="delete-page">
    <div class="page-shell">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">S</div>
                <h1>Delete Student</h1>
            </div>

            <nav class="navbar" aria-label="Main navigation">
                <div class="nav-links">
                    <a class="nav-link" href="index.html">Home</a>
                    <div class="dropdown">
                        <button class="dropdown-toggle" type="button">Students ▾</button>
                        <div class="dropdown-menu">
                            <a href="list.html">List Students</a>
                            <a href="listOne.html">Search Student</a>
                            <a href="insert.html">Add Student</a>
                            <a href="update.html">Update Student</a>
                            <a href="delete.html">Delete Student</a>
                        </div>
                    </div>
                </div>
            </nav>
        </header>

        <main class="content-card">
            <div class="page-header">
                <h2>Remove Student Record</h2>
                <button class="secondary-btn" onclick="location.href='index.html'">Home Page</button>
            </div>

            <div class="form-layout">
                <div class="field full-row">
                    <label for="sno">Student Number to Delete</label>
                    <input type="number" id="sno" placeholder="Enter student number">
                </div>

                <div class="full-row">
                    <button class="danger-btn" onclick="deleteStudent()">Delete Student</button>
                </div>
            </div>

            <div id="statusBox" class="status" role="status"></div>
        </main>
    </div>

    <script>
        function showStatus(message, type) {
            const box = document.getElementById('statusBox');
            box.textContent = message;
            box.className = 'status visible ' + type;
        }

        function deleteStudent() {
            const sno = document.getElementById('sno').value.trim();

            if (!sno) {
                showStatus('Please enter a valid student number.', 'error');
                return;
            }

            if (!confirm('Are you sure you want to delete this student record?')) {
                return;
            }

            fetch('/students/' + sno, {
                method: 'DELETE'
            })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(message => { throw new Error(message || 'Failed to delete student.'); });
                }
                return response.text();
            })
            .then(message => {
                showStatus(message, 'success');
                document.getElementById('sno').value = '';
                setTimeout(() => location.href = 'list.html', 1200);
            })
            .catch(error => {
                showStatus(error.message, 'error');
            });
        }
    </script>
</body>
</html>
