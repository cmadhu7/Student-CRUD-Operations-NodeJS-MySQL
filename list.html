<!-- To list all students data -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Students</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="list-page">
    <div class="page-shell">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">S</div>
                <h1>Student Directory</h1>
            </div>

            <nav class="navbar" aria-label="Main navigation">
                <div class="nav-links">
                    <a class="nav-link" href="index.html">Home</a>
                    <div class="dropdown">
                        <button class="dropdown-toggle" type="button">Students ▾</button>
                        <div class="dropdown-menu">
                            <a href="list.html">List Students</a>
                            <a href="listOne.html">Search Student</a>
                            <a href="insert.html">Add Student</a>
                            <a href="update.html">Update Student</a>
                            <a href="delete.html">Delete Student</a>
                        </div>
                    </div>
                </div>
            </nav>
        </header>

        <main class="content-card">
            <div class="page-header">
                <h2>List of Students</h2>
                <div class="page-toolbar">
                    <input type="text" id="searchInput" class="filter-box" placeholder="Search by student name or ID" aria-label="Search students">
                    <button class="primary-btn" onclick="loadStudents()">Refresh List</button>
                </div>
            </div>

            <div class="table-wrap">
                <table class="data-table" id="studentTable">
                    <thead>
                        <tr>
                            <th>Student Number</th>
                            <th>Name</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div id="statusBox" class="status" role="status"></div>
        </main>
    </div>

    <script>
        let studentData = [];

        document.getElementById('searchInput').addEventListener('input', applyFilter);

        function showStatus(message, type) {
            const box = document.getElementById('statusBox');
            box.textContent = message;
            box.className = 'status visible ' + type;
        }

        function applyFilter() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const tbody = document.querySelector('#studentTable tbody');

            if (!query) {
                renderRows(studentData);
                return;
            }

            const filtered = studentData.filter(student => {
                const studentId = String(student.student_id).toLowerCase();
                const studentName = String(student.student_name || '').toLowerCase();
                return studentId.includes(query) || studentName.includes(query);
            });

            renderRows(filtered);
        }

        function renderRows(data) {
            const tbody = document.querySelector('#studentTable tbody');

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="empty-state">No students found.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(student => `
                <tr>
                    <td>${student.student_id}</td>
                    <td>${student.student_name}</td>
                    <td>${student.total}</td>
                </tr>
            `).join('');
        }

        function loadStudents() {
            fetch('/students')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Unable to fetch students.');
                    }
                    return response.json();
                })
                .then(data => {
                    studentData = Array.isArray(data) ? data : [];
                    renderRows(studentData);
                    showStatus('Student list refreshed successfully.', 'success');
                })
                .catch(error => {
                    showStatus(error.message, 'error');
                });
        }

        loadStudents();
    </script>
</body>
</html>
