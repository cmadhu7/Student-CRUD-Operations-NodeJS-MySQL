<!--To insert student data-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insert Student</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="insert-page">
    <div class="page-shell">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">S</div>
                <h1>Add Student</h1>
            </div>

            <nav class="navbar" aria-label="Main navigation">
                <div class="nav-links">
                    <a class="nav-link" href="index.html">Home</a>
                    <div class="dropdown">
                        <button class="dropdown-toggle" type="button">Students ▾</button>
                        <div class="dropdown-menu">
                            <a href="list.html">List Students</a>
                            <a href="listOne.html">Search Student</a>
                            <a href="insert.html">Add Student</a>
                            <a href="update.html">Update Student</a>
                            <a href="delete.html">Delete Student</a>
                        </div>
                    </div>
                </div>
            </nav>
        </header>

        <main class="content-card">
            <div class="page-header">
                <h2>Insert Student Details</h2>
                <button class="secondary-btn" onclick="location.href='index.html'">Home Page</button>
            </div>

            <div class="form-layout">
                <div class="field">
                    <label for="sno">Student Number</label>
                    <input type="number" id="sno" placeholder="Enter student number">
                </div>

                <div class="field">
                    <label for="name">Student Name</label>
                    <input type="text" id="name" placeholder="Enter student name">
                </div>

                <div class="field full-row">
                    <label for="total">Total Marks</label>
                    <input type="number" id="total" placeholder="Enter total marks">
                </div>

                <div class="full-row">
                    <button class="primary-btn" onclick="saveStudent()">Save Student</button>
                </div>
            </div>

            <div id="statusBox" class="status" role="status"></div>
        </main>
    </div>

    <script>
        function showStatus(message, type) {
            const box = document.getElementById('statusBox');
            box.textContent = message;
            box.className = 'status visible ' + type;
        }

        function saveStudent() {
            const sno = document.getElementById('sno').value.trim();
            const name = document.getElementById('name').value.trim();
            const total = document.getElementById('total').value.trim();

            if (!sno || !name || !total) {
                showStatus('Please fill in all student details.', 'error');
                return;
            }

            fetch('/students', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    sno: sno,
                    name: name,
                    total: total
                })
            })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(message => { throw new Error(message || 'Unable to insert student.'); });
                }
                return response.text();
            })
            .then(message => {
                showStatus(message, 'success');
                document.getElementById('sno').value = '';
                document.getElementById('name').value = '';
                document.getElementById('total').value = '';
                setTimeout(() => location.href = 'list.html', 1200);
            })
            .catch(error => {
                showStatus(error.message, 'error');
            });
        }
    </script>
</body>
</html>
